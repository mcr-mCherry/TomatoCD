        var container = document.getElementById('mynetwork');
        var data = {nodes: nodes, edges: edges};
        
        var options = {
            "nodes": {
                "borderWidth": 1.5, 
                "borderWidthSelected": 4
            },
            "edges": {
                "smooth": {
                    "type": "curvedCW", 
                    "forceDirection": "none", 
                    "roundness": 0.2
                }
            },
            "physics": {
                "forceAtlas2Based": {
                    "gravitationalConstant": -120,
                    "centralGravity": 0.015,
                    "springLength": 200,
                    "springConstant": 0.05,
                    "avoidOverlap": 0.8
                },
                "minVelocity": 0.75,
                "solver": "forceAtlas2Based"
            }
        };
        
        var network = new vis.Network(container, data, options);
        
        // Add Click Event Listener
        network.on("click", function (params) {
            var infoPanel = document.getElementById('node-info-panel');
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var nodeData = nodes.get(nodeId);

                var connectedEdgesIds = network.getConnectedEdges(nodeId);
                var edgeData = edges.get(connectedEdgesIds);

                var html = "<h4 class='mb-3'>Node Details: <span class='text-primary'>" + nodeData.label + "</span></h4>";
                html += "<table class='table table-bordered table-striped bg-white'>";
                html += "<tbody>";
                
                if (nodeData.title) {
                    var titleLines = nodeData.title.split('\n');
                    for (var i = 0; i < titleLines.length; i++) {
                        var parts = titleLines[i].split(': ');
                        if (parts.length == 2) {
                            html += "<tr><th style='width: 200px;'>" + parts[0] + "</th><td>" + parts[1] + "</td></tr>";
                        } else {
                            html += "<tr><td colspan='2'>" + titleLines[i] + "</td></tr>";
                        }
                    }
                }
                html += "</tbody></table>";

                if (edgeData.length > 0) {
                    html += "<h5 class='mt-4 mb-2'>Connected Edges (" + edgeData.length + ")</h5>";
                    html += "<div style='max-height: 400px; overflow-y: auto; border: 1px solid #dee2e6;'>";
                    html += "<table class='table table-sm table-hover bg-white mb-0 text-center align-middle'>";
                    html += "<thead class='table-light' style='position: sticky; top: 0; z-index: 1;'><tr><th>Source</th><th>Target</th><th>Direction</th><th>Edge Info</th></tr></thead><tbody>";
                    for (var j = 0; j < edgeData.length; j++) {
                        var e = edgeData[j];
                        var eTitle = e.title ? e.title.replace(/\n/g, ' | ') : 'Unknown';
                        var isSource = (e.from === nodeId);
                        var rowClass = isSource ? "table-primary" : "table-secondary";
                        var dirIcon = isSource ? "<span class='badge bg-primary'>&rarr; Outgoing</span>" : "<span class='badge bg-secondary'>&larr; Incoming</span>";
                        html += "<tr class='" + rowClass + "'><td><strong>" + e.from + "</strong></td><td><strong>" + e.to + "</strong></td><td>" + dirIcon + "</td><td><small class='text-muted'>" + eTitle + "</small></td></tr>";
                    }
                    html += "</tbody></table></div>";
                }

                infoPanel.innerHTML = html;
                infoPanel.style.display = "block";
                
                // Smooth scroll to the panel
                setTimeout(function() {
                    infoPanel.scrollIntoView({behavior: "smooth", block: "nearest"});
                }, 100);
                
            } else {
                infoPanel.style.display = "none";
            }
        });
    </script>
