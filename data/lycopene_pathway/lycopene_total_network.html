                if (nodeData.title) {
                    var titleLines = nodeData.title.split('\n');
                    for (var i = 0; i < titleLines.length; i++) {
                        var parts = titleLines[i].split(': ');
                        if (parts.length == 2) {
                            html += "<tr><th style='width: 200px;'>" + parts[0] + "</th><td>" + parts[1] + "</td></tr>";
                        } else {
                            html += "<tr><td colspan='2'>" + titleLines[i] + "</td></tr>";
                        }
                    }
                }
                html += "</tbody></table>";

                if (edgeData.length > 0) {
                    html += "<h5 class='mt-4 mb-2'>Connected Edges (" + edgeData.length + ")</h5>";
                    html += "<div style='max-height: 400px; overflow-y: auto; border: 1px solid #dee2e6;'>";
                    html += "<table class='table table-sm table-hover bg-white mb-0 text-center align-middle'>";
                    html += "<thead class='table-light' style='position: sticky; top: 0; z-index: 1;'><tr><th>Source</th><th>Target</th><th>Direction</th><th>Edge Info</th></tr></thead><tbody>";
                    for (var j = 0; j < edgeData.length; j++) {
                        var e = edgeData[j];
                        var eTitle = e.title ? e.title.replace(/\n/g, ' | ') : 'Unknown';
                        var isSource = (e.from === nodeId);
                        var rowClass = isSource ? "table-primary" : "table-secondary";
                        var dirIcon = isSource ? "<span class='badge bg-primary'>&rarr; Outgoing</span>" : "<span class='badge bg-secondary'>&larr; Incoming</span>";
                        html += "<tr class='" + rowClass + "'><td><strong>" + e.from + "</strong></td><td><strong>" + e.to + "</strong></td><td>" + dirIcon + "</td><td><small class='text-muted'>" + eTitle + "</small></td></tr>";
                    }
                    html += "</tbody></table></div>";
                }

                infoPanel.innerHTML = html;
                infoPanel.style.display = "block";
                setTimeout(function() {
                    infoPanel.scrollIntoView({behavior: "smooth", block: "nearest"});
                }, 100);
            } else {
                infoPanel.style.display = "none";
            }
        });
        
        document.getElementById('exportPdfBtn').addEventListener('click', function() {
            var element = document.getElementById('network-export-area');
            var opt = {
                margin:       10,
                filename:     'Lycopene_Regulatory_Network.pdf',
                image:        { type: 'jpeg', quality: 1.0 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a3', orientation: 'landscape' }
            };
            html2pdf().set(opt).from(element).save();
        });

        document.getElementById('exportSvgBtn').addEventListener('click', function() {
            var positions = network.getPositions();
            var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (var id in positions) {
                minX = Math.min(minX, positions[id].x);
                maxX = Math.max(maxX, positions[id].x);
                minY = Math.min(minY, positions[id].y);
                maxY = Math.max(maxY, positions[id].y);
            }
            minX -= 150; maxX += 150; minY -= 150; maxY += 150;
            var width = maxX - minX;
            var height = maxY - minY;
            
            var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '" viewBox="' + minX + ' ' + minY + ' ' + width + ' ' + height + '">\n';
            
            var nodesArr = nodes.get();
            var edgesArr = edges.get();

            // Draw Edges
            edgesArr.forEach(function(e) {
                var pos1 = positions[e.from];
                var pos2 = positions[e.to];
                if(!pos1 || !pos2) return;
                
                var color = e.color || "black";
                var strokeWidth = e.width || 1;
                var dash = "";
                if (e.dashes) {
                    if (Array.isArray(e.dashes)) {
                        dash = 'stroke-dasharray="' + e.dashes.join(',') + '"';
                    } else {
                        dash = 'stroke-dasharray="5,5"';
                    }
                }
                
                var dx = pos2.x - pos1.x;
                var dy = pos2.y - pos1.y;
                var dist = Math.sqrt(dx*dx + dy*dy);
                
                var tNode = nodes.get(e.to);
                var tSize = tNode.size || 20;
                if (tNode.shape === 'box') tSize = 40; 
                
                var ratio = (dist - tSize - 5) / dist;
                if (ratio < 0) ratio = 0;

                var markerId = 'url(#arrow-' + color.replace('#', '') + ')';
                var drawArrow = (e.arrows === "to" || e.arrows === "to, from");

                // Default to curved if not specified otherwise
                var smoothOptions = e.smooth !== undefined ? e.smooth : { type: "curvedCW", roundness: 0.2 };
                var isCurved = smoothOptions && smoothOptions.type && smoothOptions.type.indexOf('curved') !== -1;

                if (isCurved) {
                    var roundness = smoothOptions.roundness || 0.2;
                    var cx, cy;
                    if (smoothOptions.type === 'curvedCW') {
                        cx = pos1.x + dx/2 - dy * roundness;
                        cy = pos1.y + dy/2 + dx * roundness;
                    } else {
                        cx = pos1.x + dx/2 + dy * roundness;
                        cy = pos1.y + dy/2 - dx * roundness;
                    }
                    
                    var t = ratio;
                    var mt = 1 - t;
                    var endX = mt*mt * pos1.x + 2*mt*t * cx + t*t * pos2.x;
                    var endY = mt*mt * pos1.y + 2*mt*t * cy + t*t * pos2.y;
                    
                    var newCx = mt * pos1.x + t * cx;
                    var newCy = mt * pos1.y + t * cy;
                    
                    svg += '<path d="M ' + pos1.x + ' ' + pos1.y + ' Q ' + newCx + ' ' + newCy + ' ' + endX + ' ' + endY + '" stroke="' + color + '" stroke-width="' + strokeWidth + '" fill="none" ' + dash + ' />\n';
                    
                    if (drawArrow) {
                        var vx = 2 * mt * (cx - pos1.x) + 2 * t * (pos2.x - cx);
                        var vy = 2 * mt * (cy - pos1.y) + 2 * t * (pos2.y - cy);
                        var angle = Math.atan2(vy, vx);
                        var arrowLen = 12;
                        var arrowWidth = 6;
                        var baseX = endX - arrowLen * Math.cos(angle);
                        var baseY = endY - arrowLen * Math.sin(angle);
                        var p1X = baseX + arrowWidth * Math.cos(angle + Math.PI/2);
                        var p1Y = baseY + arrowWidth * Math.sin(angle + Math.PI/2);
                        var p2X = baseX + arrowWidth * Math.cos(angle - Math.PI/2);
                        var p2Y = baseY + arrowWidth * Math.sin(angle - Math.PI/2);
                        svg += '<polygon points="' + endX + ',' + endY + ' ' + p1X + ',' + p1Y + ' ' + p2X + ',' + p2Y + '" fill="' + color + '" />\n';
                    }
                } else {
                    var endX = pos1.x + dx * ratio;
                    var endY = pos1.y + dy * ratio;
                    svg += '<line x1="' + pos1.x + '" y1="' + pos1.y + '" x2="' + endX + '" y2="' + endY + '" stroke="' + color + '" stroke-width="' + strokeWidth + '" ' + dash + ' />\n';
                    
                    if (drawArrow) {
                        var angle = Math.atan2(dy, dx);
                        var arrowLen = 12;
                        var arrowWidth = 6;
                        var baseX = endX - arrowLen * Math.cos(angle);
                        var baseY = endY - arrowLen * Math.sin(angle);
                        var p1X = baseX + arrowWidth * Math.cos(angle + Math.PI/2);
                        var p1Y = baseY + arrowWidth * Math.sin(angle + Math.PI/2);
                        var p2X = baseX + arrowWidth * Math.cos(angle - Math.PI/2);
                        var p2Y = baseY + arrowWidth * Math.sin(angle - Math.PI/2);
                        svg += '<polygon points="' + endX + ',' + endY + ' ' + p1X + ',' + p1Y + ' ' + p2X + ',' + p2Y + '" fill="' + color + '" />\n';
                    }
                }
            });

            // Draw Nodes
            nodesArr.forEach(function(n) {
                var pos = positions[n.id];
                if(!pos) return;
                var size = n.size || 20;
                var bgColor = n.color || "#ccc";
                var borderColor = "#000";
                var borderWidth = n.borderWidth || 1.5;
                
                if (typeof n.color === 'object') {
                    bgColor = n.color.background || bgColor;
                    borderColor = n.color.border || borderColor;
                }
                
                if (n.shape === 'box') {
                    var width = n.label.length * 12 + 20; 
                    var height = size;
                    svg += '<rect x="' + (pos.x - width/2) + '" y="' + (pos.y - height/2) + '" width="' + width + '" height="' + height + '" fill="' + bgColor + '" stroke="' + borderColor + '" stroke-width="' + borderWidth + '" rx="5" ry="5" />\n';
                } else if (n.shape === 'diamond') {
                    svg += '<polygon points="' + pos.x + ',' + (pos.y-size) + ' ' + (pos.x+size) + ',' + pos.y + ' ' + pos.x + ',' + (pos.y+size) + ' ' + (pos.x-size) + ',' + pos.y + '" fill="' + bgColor + '" stroke="' + borderColor + '" stroke-width="' + borderWidth + '" />\n';
                } else { 
                    svg += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="' + size + '" fill="' + bgColor + '" stroke="' + borderColor + '" stroke-width="' + borderWidth + '" />\n';
                }
                
                var fontSize = 14;
                var fontColor = "#000";
                var fontWeight = "normal";
                if (n.font) {
                    if (n.font.size) fontSize = n.font.size;
                    if (n.font.color) fontColor = n.font.color;
                    if (n.font.bold) fontWeight = "bold";
                }
                
                var textY = pos.y;
                if (n.shape !== 'box') {
                    textY = pos.y + size + fontSize; 
                } else {
                    textY = pos.y + fontSize/3; 
                }
                
                svg += '<text x="' + pos.x + '" y="' + textY + '" font-family="Arial" font-size="' + fontSize + '" font-weight="' + fontWeight + '" fill="' + fontColor + '" text-anchor="middle">' + n.label + '</text>\n';
            });

            svg += '</svg>';
            
            var blob = new Blob([svg], {type: "image/svg+xml;charset=utf-8"});
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = "Lycopene_Regulatory_Network_Vector.svg";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>
